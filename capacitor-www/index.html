<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Personal Digital</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0B0F0C;
        color: #E8FFE3;

        display: grid;
        place-items: center;
        text-align: center;

      .dot { width: 14px; height: 14px; border-radius: 999px; background: #C6F432; margin: 0 auto 16px; }

  <body>
    <div>
      <div class="dot"></div>
